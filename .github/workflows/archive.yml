name: Archive environmental data
# Saves Open-Meteo UKMO and UK-AIR (PM2.5, NO2) (and SEPA KiWIS when enabled) to R2 every 15 minutes.
# Secrets (set by the repository owner): R2_ACCOUNT_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - run: uv run python -m collectors.archive
        env:
          # SEPA KiWIS rate-limits anonymous IPs (HTTP 429); add sepa_kiwis back via the
          # ARCHIVE_SOURCES repo variable once SEPA access is sorted.
          ARCHIVE_SOURCES: ${{ vars.ARCHIVE_SOURCES || 'open_meteo_ukmo,uk_air' }}
          R2_ACCOUNT_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
