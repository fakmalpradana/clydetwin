[project]
name = "clydetwin"
version = "0.0.0"
description = "Open-data 3D digital twin of Glasgow: pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Fairuz Akmal Pradana" }]
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
