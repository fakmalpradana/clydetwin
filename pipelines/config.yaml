# ClydeTwin pipeline configuration. All paths are relative to the repo root.
crs: 27700                      # analysis CRS (OSGB36 / British National Grid)

aoi:
  authority: "Glasgow City"     # Boundary-Line AdministrativeUnit "text" value
  buffer_m: 500
  # Phase 3: extra areas unioned into the AOI (EPSG:27700 bbox: minx, miny, maxx, maxy).
  # glasgow-airport: EGPF lies in Renfrewshire, just west of the council boundary. Runway 05/23 runs from about
  # E246.2k N666.2k to E248.6k N667.7k; the box adds ~2 km of approach at both ends plus Renfrew and the terminal.
  extra:
    - name: glasgow-airport
      bbox: [244000, 665000, 251000, 669500]
  path: data/aoi.gpkg

sample:
  # One 1 km tile around George Square / Merchant City (EPSG:27700: minx, miny, maxx, maxy)
  bbox: [259000, 665000, 260000, 666000]

lidar:
  # Phase 5 (Fugro for SPEN, flown 2020-05-28 .. 2021-04-12) covers 100% of the AOI; see docs/data-verification.md
  catalogue_api: https://api.remotesensing.data.gov.scot
  collection_dsm: scotland-gov/lidar/phase-5/dsm
  collection_dtm: scotland-gov/lidar/phase-5/dtm
  year: 2020                    # lidar_year attribute: first year of the acquisition window (conservative)
  raw_dir: data/raw/lidar

os:
  downloads_api: https://api.os.uk/downloads/v1/products
  raw_dir: data/raw/os
  grid_square: NS

heights:
  default_height_m: 6.0         # used when a footprint has no valid LiDAR pixels or nDSM height < min_height_m
  min_height_m: 2.0

analytics:
  # LoD1 heights (built by `make lod1 MODE=aoi`) are the building universe; override with CLYDETWIN_HEIGHTS
  heights: ../clydetwin/build/aoi/heights.gpkg
  raw_dir: data/raw/analytics
  out_dir: build/analytics
  uprn_match_max_m: 2           # UPRN to footprint: inside, or nearest within this distance
  storey_height_m: 3.0          # X1 storeys = height / this (documented heuristic)
  noise_buffer_m: 10            # X6: max Lden over the footprint buffered by this (loudest-facade proxy)
