# Local PostGIS used only to build 3D Tiles (pg2b3dm reads from it).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clydetwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clydetwin_local}
      POSTGRES_DB: ${POSTGRES_DB:-clydetwin}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clydetwin}"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
